plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retrotv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.retrotv.app"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
