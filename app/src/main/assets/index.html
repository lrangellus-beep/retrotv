<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Retro TV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">

  <header id="top">
    <div class="brand">
      <svg class="brand-ico" viewBox="0 0 64 64" aria-hidden="true">
        <line x1="22" y1="12" x2="30" y2="22" stroke="#2f8bff" stroke-width="4" stroke-linecap="round"/>
        <line x1="42" y1="12" x2="34" y2="22" stroke="#2f8bff" stroke-width="4" stroke-linecap="round"/>
        <rect x="4" y="20" width="56" height="38" rx="9" fill="#0d1b33" stroke="#2f8bff" stroke-width="4"/>
        <circle cx="32" cy="39" r="13" fill="#22c55e"/>
        <polygon points="28,32 28,46 41,39" fill="#0d1b33"/>
      </svg>
      <span class="brand-name">Retro <b>TV</b></span>
    </div>
    <nav id="tabs"></nav>
    <div id="tools">
      <button class="tool" id="btnSearch" aria-label="Buscar"></button>
      <button class="tool" id="btnSettings" aria-label="Configurações"></button>
    </div>
    <div id="clock"><div id="time">--:--</div><div id="date"></div></div>
  </header>

  <aside id="side">
    <div id="chips"></div>
    <div id="list"></div>
  </aside>

  <section id="player">
    <video id="video" playsinline autoplay></video>
    <div id="vmsg"></div>
    <div id="fsbanner"></div>
  </section>

  <section id="info"></section>

  <section id="epg">
    <div id="epgHead">
      <div class="epg-day"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Hoje</span></div>
      <div id="ruler"></div>
    </div>
    <div id="epgRows"></div>
    <div id="nowline"></div>
  </section>

  <footer id="hints">
    <div class="hint left"><svg viewBox="0 0 24 24"><path d="M10 7l-5 5 5 5M5 12h12a3 3 0 0 0 0-6h-3"/></svg>Voltar</div>
    <div class="hint mid"><svg viewBox="0 0 24 24"><path d="M12 3l3 4h-6zM12 21l-3-4h6zM3 12l4-3v6zM21 12l-4 3v-6z"/></svg>Navegar</div>
    <div class="hint mid2"><span class="okkey">OK</span>Selecionar</div>
    <div class="hint right"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"/></svg>Segurar OK: favoritar</div>
  </footer>

  <div id="modal" class="hidden"></div>
</div>
<script src="channels.js"></script>
<script src="app.js"></script>
</body>
</html>
